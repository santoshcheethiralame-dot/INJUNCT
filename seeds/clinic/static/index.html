<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bengaluru Dental &middot; Front Desk</title>
<style>
  :root{--bg:#0E1014;--pan:#161A20;--brd:#242A31;--txt:#E7E4DF;--mut:#79818B;--ver:#E8442C;--grn:#6FCF97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  header{padding:26px 30px 20px;border-bottom:1px solid var(--brd);display:flex;
         justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font:600 20px/1.2 Georgia,serif;margin:0;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--mut)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:7px}
  main{padding:22px 30px 40px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font:500 10px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;
     color:var(--mut);padding:0 12px 12px}
  td{padding:13px 12px;border-top:1px solid var(--brd);font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--pan)}
  .down{margin:60px auto;max-width:430px;text-align:center;border:1px solid var(--ver);
        border-radius:10px;padding:34px 28px;background:#170F0F}
  .down .b{font:600 26px/1.2 Georgia,serif;color:var(--ver);margin-bottom:12px}
  .down .m{font-size:13px;color:#B29A94;line-height:1.6}
  .down code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#8A7B76;
             display:block;margin-top:14px;word-break:break-word}
</style>
<header>
  <h1>Bengaluru Dental</h1>
  <div class="sub" id="status"><span class="dot"></span>front desk &middot; live</div>
</header>
<main id="out"></main>
<script>
fetch('/api/patients').then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)))
  .then(d => {
    document.getElementById('out').innerHTML =
      '<table><thead><tr>' + d.fields.map(f => `<th>${d.labels[f] || f}</th>`).join('') +
      '</tr></thead><tbody>' + d.rows.map(r =>
        '<tr>' + d.fields.map(f => `<td>${r[f] ?? ''}</td>`).join('') + '</tr>').join('') +
      '</tbody></table>';
  })
  .catch(e => {
    document.getElementById('status').innerHTML =
      '<span class="dot" style="background:#E8442C"></span>front desk &middot; down';
    document.getElementById('out').innerHTML =
      '<div class="down"><div class="b">Service unavailable</div>' +
      '<div class="m">The front desk cannot read patient records.' +
      '<code>' + (e.error || 'unknown error') + '</code></div></div>';
  });
</script>
